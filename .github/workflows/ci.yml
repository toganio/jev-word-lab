name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Test, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Verify bundled classification is included unchanged
        run: cmp data/jev-category-map-36-complete.json dist/client/data/jev-category-map-36-complete.json
      - name: Prepare and smoke-test a clean local installation
        run: |
          npm run predev
          node scripts/smoke-local.mjs
